<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Cal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .presets-pills {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .presets-pills::-webkit-scrollbar { display: none; }

    .pill {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover {
      background: rgba(59, 130, 246, 0.25);
      color: #fff;
    }

    textarea, input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    button:hover { background: var(--accent-hover); }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: auto;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }
    button.secondary:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      width: auto;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    /* PREVIEW ITEM CARDS */
    .preview-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .preview-body { display: flex; flex-direction: column; gap: 0.25rem; }
    .preview-title-row { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .preview-meta-row { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }

    .tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .cat-item:last-child { border-bottom: none; }

    .status-box {
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); }
    .status-info { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent); color: var(--accent); }

    .hidden { display: none !important; }

    /* Color Swatches */
    .color-1 { background-color: #a4bdfc; color: #111; }
    .color-2 { background-color: #7ae7bf; color: #111; }
    .color-3 { background-color: #dbadff; color: #111; }
    .color-4 { background-color: #ff887c; color: #111; }
    .color-5 { background-color: #fbd75b; color: #111; }
    .color-6 { background-color: #ffb878; color: #111; }
    .color-7 { background-color: #46d6db; color: #111; }
    .color-8 { background-color: #e1e1e1; color: #111; }
    .color-9 { background-color: #5484ed; color: #fff; }
    .color-10 { background-color: #51b749; color: #fff; }
    .color-11 { background-color: #dc2127; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚡ Quick Cal</h1>
      <button class="secondary" onclick="toggleSettings()">⚙️ Settings</button>
    </header>

    <!-- MAIN APP VIEW -->
    <main id="main-view">
      <div class="card">
        <div class="presets-pills">
          <span class="pill" onclick="loadPreset('classes')">📚 Classes</span>
          <span class="pill" onclick="loadPreset('labs')">🧪 Labs</span>
          <span class="pill" onclick="loadPreset('all')">⚡ All Schedule</span>
          <span class="pill" onclick="loadPreset('arvp')">🤖 ARVP</span>
          <span class="pill" onclick="loadPreset('study')">📖 Study</span>
        </div>

        <div>
          <label for="promptInput">Enter Prompt or Schedule:</label>
          <textarea id="promptInput" rows="3" placeholder="e.g. Catch up on studying Oct 18 from 2pm to 5pm in Cameron Library"></textarea>
        </div>

        <button onclick="scheduleAllEvents()">Sync to Google Calendar</button>

        <div id="statusBox" class="hidden"></div>
      </div>

      <!-- PARSED PREVIEW -->
      <div id="previewCard" class="card hidden" style="margin-top: 1rem;">
        <label>Parsed Event Queue</label>
        <div id="previewList" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
      </div>
    </main>

    <!-- SETTINGS VIEW -->
    <section id="settings-view" class="hidden">
      <div class="card">
        <h3>Google API Credentials</h3>
        <label style="font-size:0.75rem;">OAuth Client ID:</label>
        <input type="text" id="clientIdInput" placeholder="Paste Client ID here">
        <button onclick="saveClientId()">Save Client ID</button>
      </div>

      <div class="card" style="margin-top: 1rem;">
        <h3>Category Manager</h3>
        <div id="categoryList"></div>

        <hr style="border:0; border-top: 1px solid var(--border); margin: 0.5rem 0;">

        <label style="font-size:0.75rem;">Add Category</label>
        <input type="text" id="newCatName" placeholder="Category Name (e.g. Studying)">
        <input type="text" id="newCatKeywords" placeholder="Keywords (e.g. study, homework, exam)">
        
        <label style="font-size:0.75rem;">Google Calendar Color:</label>
        <select id="newCatColor">
          <option value="9">Blueberry (Blue - Classes)</option>
          <option value="11">Tomato (Red - Labs & Exams)</option>
          <option value="3">Grape (Purple - Studying)</option>
          <option value="7">Peacock (Cyan - Clubs/ARVP)</option>
          <option value="5">Banana (Yellow - Projects)</option>
          <option value="6">Tangerine (Orange - Work)</option>
          <option value="10">Basil (Green - Gym/Personal)</option>
        </select>

        <button onclick="addCategory()">Add Category</button>
      </div>

      <button class="secondary" style="margin-top: 1rem; width:100%;" onclick="toggleSettings()">← Back to App</button>
    </section>
  </div>

  <script>
    // --- PRESETS ---
    const HARDCODED_CLASSES = `ECE 370 Lecture A2 at NRE 2-001 every Tue/Thu 8:00am to 9:20am
MATH 309 Lecture A1 at ETLC E1-013 every MWF 9:00am to 9:50am
ECE 312 Lecture A1 at ETLC E1-013 every Tue/Thu 9:30am to 10:50am
ECE 302 Lecture A2 at CCIS L2-190 every MWF 10:00am to 10:50am
ECE 330 Lecture A1 at ETLC E1-017 every MWF 11:00am to 11:50am
ECE 340 Lecture A1 at MEC 2-1 every Tue/Thu 11:00am to 12:20pm
ECE 370 Seminar E12 at ETLC E2-001 every Monday 12:00pm to 12:50pm
ECE 302 Seminar E32 at ED 129 every Wednesday 12:00pm to 12:50pm`;

    const HARDCODED_LABS = `ECE 330 Lab 1 D12 at ECERF W1-001 Sep 21 2:00pm to 4:50pm
ECE 330 Lab 2 D12 at ECERF W1-001 Oct 26 2:00pm to 4:50pm
ECE 330 Lab 3 D12 at ECERF W1-001 Nov 23 2:00pm to 4:50pm
ECE 340 Lab 0 D21 at ETLC E5-012 Sep 8 2:00pm to 4:50pm
ECE 340 Lab 1 D21 at ETLC E5-012 Sep 22 2:00pm to 4:50pm
ECE 340 Lab 2 D21 at ETLC E5-012 Oct 6 2:00pm to 4:50pm
ECE 340 Lab 3 D21 at ETLC E5-012 Oct 20 2:00pm to 4:50pm
ECE 340 Lab 4 D21 at ETLC E5-012 Nov 3 2:00pm to 4:50pm
ECE 340 Lab 5 D21 at ETLC E5-012 Nov 24 2:00pm to 4:50pm
ECE 312 Lab 0 D31 at ETLC E4-012 Sep 9 2:00pm to 4:50pm
ECE 312 Lab 1 D31 at ETLC E4-012 Sep 30 2:00pm to 4:50pm
ECE 312 Lab 2 D31 at ETLC E4-012 Oct 21 2:00pm to 4:50pm
ECE 312 Lab 3 D31 at ETLC E4-012 Nov 4 2:00pm to 4:50pm
ECE 312 Project Proposal D31 at ETLC E4-012 Nov 18 2:00pm to 4:50pm
ECE 302 Lab Intro D42 at ETLC E4-001 Sep 17 3:00pm to 4:50pm
ECE 302 Lab 1 D42 at ETLC E4-001 Sep 24 2:00pm to 4:50pm
ECE 302 Lab 2 D42 at ETLC E4-001 Oct 15 2:00pm to 4:50pm
ECE 302 Lab 3 D42 at ETLC E4-001 Oct 29 2:00pm to 4:50pm
ECE 302 Lab 4 D42 at ETLC E4-001 Nov 19 2:00pm to 4:50pm
ECE 302 Lab 5 D42 at ETLC E4-001 Dec 3 2:00pm to 4:50pm`;

    const PRESET_ARVP = "ARVP Pool Test at PAC Pool Oct 20 6:15pm to 9:00pm";
    const PRESET_STUDY = "Catch up on studying ECE 302 Oct 18 2:00pm to 5:00pm in Cameron Library";

    const DEFAULT_CATEGORIES = [
      { name: "Lectures / Classes", colorId: "9", keywords: ["lecture", "class", "ece", "cmput", "encmp", "math", "phys", "chem", "stat", "engg"] },
      { name: "Labs & Seminars", colorId: "11", keywords: ["lab", "seminar", "demo", "checkout", "tutorial"] },
      { name: "Studying & HW", colorId: "3", keywords: ["study", "studying", "hw", "homework", "assignment", "catch up", "review", "prep", "reading"] },
      { name: "Clubs & Teams", colorId: "7", keywords: ["arvp", "club", "team", "robotics", "formula", "meeting"] },
      { name: "Personal Projects", colorId: "5", keywords: ["project", "side project", "dev", "code", "github"] },
      { name: "Exams & Midterms", colorId: "4", keywords: ["midterm", "exam", "final", "quiz"] }
    ];

    let categories = JSON.parse(localStorage.getItem("quickcal_categories")) || DEFAULT_CATEGORIES;
    let clientId = localStorage.getItem("quickcal_client_id") || "";
    let cachedAccessToken = null;
    let parsedEventsStore = [];

    document.getElementById("clientIdInput").value = clientId;

    document.getElementById("promptInput").addEventListener("input", parseAndPreview);

    function loadPreset(type) {
      const area = document.getElementById("promptInput");
      if (type === 'classes') area.value = HARDCODED_CLASSES;
      else if (type === 'labs') area.value = HARDCODED_LABS;
      else if (type === 'all') area.value = HARDCODED_CLASSES + "\n" + HARDCODED_LABS;
      else if (type === 'arvp') area.value = PRESET_ARVP;
      else if (type === 'study') area.value = PRESET_STUDY;
      parseAndPreview();
    }

    function toggleSettings() {
      document.getElementById("main-view").classList.toggle("hidden");
      document.getElementById("settings-view").classList.toggle("hidden");
      renderCategories();
    }

    function saveClientId() {
      clientId = document.getElementById("clientIdInput").value.trim();
      localStorage.setItem("quickcal_client_id", clientId);
      alert("Client ID saved!");
    }

    function renderCategories() {
      const container = document.getElementById("categoryList");
      container.innerHTML = "";
      categories.forEach((cat, index) => {
        const div = document.createElement("div");
        div.className = "cat-item";
        div.innerHTML = `
          <div>
            <strong><span class="tag color-${cat.colorId}">${cat.name}</span></strong>
            <br><small style="color:var(--text-muted);">${cat.keywords.join(", ")}</small>
          </div>
          <button class="btn-danger" onclick="deleteCategory(${index})">Delete</button>
        `;
        container.appendChild(div);
      });
    }

    function addCategory() {
      const name = document.getElementById("newCatName").value.trim();
      const keywordsRaw = document.getElementById("newCatKeywords").value.trim();
      const colorId = document.getElementById("newCatColor").value;

      if (!name || !keywordsRaw) return alert("Please enter name and keywords.");

      const keywords = keywordsRaw.split(",").map(k => k.trim().toLowerCase()).filter(k => k);
      categories.push({ name, colorId, keywords });
      localStorage.setItem("quickcal_categories", JSON.stringify(categories));

      document.getElementById("newCatName").value = "";
      document.getElementById("newCatKeywords").value = "";
      renderCategories();
    }

    function deleteCategory(index) {
      categories.splice(index, 1);
      localStorage.setItem("quickcal_categories", JSON.stringify(categories));
      renderCategories();
    }

    // --- RECURRENCE & LOCATION PARSER ---
    function parseRecurrence(text) {
      const untilClause = ";UNTIL=20261208T235959Z";

      if (/\bevery\s+(mwf|mon,?\s*wed,?\s*fri)\b/i.test(text) || /\bmwf\b/i.test(text)) {
        return [`RRULE:FREQ=WEEKLY;BYDAY=MO,WE,FR${untilClause}`];
      }
      if (/\bevery\s+(tue\/thu|tth|tr|tue,?\s*thu)\b/i.test(text) || /\btue\/thu\b/i.test(text) || /\btth\b/i.test(text)) {
        return [`RRULE:FREQ=WEEKLY;BYDAY=TU,TH${untilClause}`];
      }
      if (/\bevery\s+monday\b/i.test(text)) return [`RRULE:FREQ=WEEKLY;BYDAY=MO${untilClause}`];
      if (/\bevery\s+tuesday\b/i.test(text)) return [`RRULE:FREQ=WEEKLY;BYDAY=TU${untilClause}`];
      if (/\bevery\s+wednesday\b/i.test(text)) return [`RRULE:FREQ=WEEKLY;BYDAY=WE${untilClause}`];
      if (/\bevery\s+thursday\b/i.test(text)) return [`RRULE:FREQ=WEEKLY;BYDAY=TH${untilClause}`];
      if (/\bevery\s+friday\b/i.test(text)) return [`RRULE:FREQ=WEEKLY;BYDAY=FR${untilClause}`];

      return null;
    }

    function parseLocation(text) {
      const locMatch = text.match(/(?:\bat|\bin)\s+([A-Z0-9\-\s]{2,25})(?=\s+(?:every|from|on|\d|oct|nov|dec|jan|feb|mar|apr|may|jun|jul|aug|sep)|$)/i);
      return locMatch ? locMatch[1].trim() : "";
    }

    // --- LINE PARSER ---
    function parseSingleLine(line) {
      const lower = line.toLowerCase();
      
      let cat = categories.find(c => c.keywords.some(kw => lower.includes(kw))) || { name: "General", colorId: "1" };
      let location = parseLocation(line);
      let recurrence = parseRecurrence(line);

      const now = new Date();
      let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const monthMap = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
      const dateMatch = lower.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})/);

      if (dateMatch) {
        targetDate.setMonth(monthMap[dateMatch[1].substring(0, 3)], parseInt(dateMatch[2], 10));
        if (targetDate < now && (now - targetDate) > 86400000 * 30) targetDate.setFullYear(now.getFullYear() + 1);
      } else if (lower.includes("tomorrow")) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      let startH = 14, startM = 0, endH = 15, endM = 0;
      const timeMatch = line.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:to|-)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);

      if (timeMatch) {
        let h1 = parseInt(timeMatch[1], 10), m1 = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0, p1 = timeMatch[3] ? timeMatch[3].toLowerCase() : null;
        let h2 = parseInt(timeMatch[4], 10), m2 = timeMatch[5] ? parseInt(timeMatch[5], 10) : 0, p2 = timeMatch[6].toLowerCase();

        if (!p1) p1 = p2;
        if (p1 === "pm" && h1 < 12) h1 += 12;
        if (p1 === "am" && h1 === 12) h1 = 0;
        if (p2 === "pm" && h2 < 12) h2 += 12;
        if (p2 === "am" && h2 === 12) h2 = 0;

        startH = h1; startM = m1; endH = h2; endM = m2;
      }

      const start = new Date(targetDate); start.setHours(startH, startM, 0, 0);
      const end = new Date(targetDate); end.setHours(endH, endM, 0, 0);

      let cleanTitle = line
        .replace(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}/gi, "")
        .replace(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:to|-)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi, "")
        .replace(/\bevery\s+[a-z,\/\s]+/gi, "")
        .replace(/\b(mwf|tth|tue\/thu|tr)\b/gi, "")
        .replace(/(?:\bat|\bin)\s+[A-Z0-9\-\s]{2,25}/gi, "")
        .replace(/\btomorrow\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      if (!cleanTitle) cleanTitle = line;

      return { title: cleanTitle, category: cat.name, colorId: cat.colorId, location, recurrence, start, end };
    }

    function parseAndPreview() {
      const text = document.getElementById("promptInput").value.trim();
      if (!text) {
        document.getElementById("previewCard").classList.add("hidden");
        parsedEventsStore = [];
        return;
      }

      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      parsedEventsStore = lines.map(parseSingleLine);
      renderPreviewList(parsedEventsStore);
    }

    function removeEvent(idx) {
      parsedEventsStore.splice(idx, 1);
      renderPreviewList(parsedEventsStore);
    }

    function renderPreviewList(events) {
      const container = document.getElementById("previewList");
      container.innerHTML = "";
      document.getElementById("previewCard").classList.remove("hidden");

      events.forEach((ev, idx) => {
        const item = document.createElement("div");
        item.className = "preview-item";
        item.innerHTML = `
          <div class="preview-body">
            <div class="preview-title-row">
              ${ev.title}
              <span class="tag color-${ev.colorId}">${ev.category}</span>
            </div>
            <div class="preview-meta-row">
              📍 <strong>${ev.location || "No Location"}</strong> | ⏰ <strong>${ev.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${ev.end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</strong> | 🔄 <strong>${ev.recurrence ? "Recurring (Until Dec 8)" : "One-time"}</strong>
            </div>
          </div>
          <button class="btn-danger" onclick="removeEvent(${idx})">✕</button>
        `;
        container.appendChild(item);
      });
    }

    // --- CALENDAR API PUSH ---
    function scheduleAllEvents() {
      if (parsedEventsStore.length === 0) parseAndPreview();
      if (parsedEventsStore.length === 0) return alert("Please enter or select a schedule preset first.");

      if (!clientId) {
        alert("Please enter your OAuth Client ID in Settings first.");
        toggleSettings();
        return;
      }

      getAccessToken((token) => {
        let insertedCount = 0;
        showStatus(`Scheduling ${parsedEventsStore.length} event(s) to Google Calendar...`, "info");

        parsedEventsStore.forEach((ev) => {
          insertEventToGCal(token, ev, (success) => {
            if (success) insertedCount++;
            if (insertedCount === parsedEventsStore.length) {
              showStatus(`✅ Added ${insertedCount} event(s) to Google Calendar!`, "success");
            }
          });
        });
      });
    }

    function getAccessToken(callback) {
      if (cachedAccessToken) {
        callback(cachedAccessToken);
        return;
      }

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/calendar.events",
        callback: (resp) => {
          if (resp.access_token) {
            cachedAccessToken = resp.access_token;
            callback(resp.access_token);
          } else {
            alert("Authorization failed. Ensure your email is added under Test Users in Google Cloud Console.");
          }
        }
      });
      tokenClient.requestAccessToken();
    }

    function insertEventToGCal(token, ev, onDone) {
      const payload = {
        summary: `[${ev.category}] ${ev.title}`,
        colorId: ev.colorId,
        location: ev.location,
        start: { dateTime: ev.start.toISOString() },
        end: { dateTime: ev.end.toISOString() },
        reminders: { useDefault: false, overrides: [{ method: "email", minutes: 30 }] }
      };

      if (ev.recurrence) payload.recurrence = ev.recurrence;

      fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => onDone(!!data.id))
      .catch(err => {
        console.error(err);
        onDone(false);
      });
    }

    function showStatus(msg, type) {
      const box = document.getElementById("statusBox");
      box.className = `status-box status-${type}`;
      box.innerText = msg;
      box.classList.remove("hidden");
    }

    renderCategories();
  </script>
</body>
</html>
